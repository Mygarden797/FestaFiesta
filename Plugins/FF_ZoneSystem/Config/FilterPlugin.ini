[FilterPlugin]
; @file FilterPlugin.ini
; @brief UAT BuildPlugin이 Source/Binaries 외에 패키지에 함께 넣을 추가 파일을 선언한다.
;
; UAT가 이 파일명을 고정해서 읽으므로 FF_ 접두사 예외다. 경로는 플러그인 루트 기준이며
; '/'로 시작한다. 문서나 기본 설정 파일명을 바꾸면 이 목록도 같은 변경에서 갱신해야 한다.
; 이 manifest는 파일을 생성하거나 빌드하지 않고, BuildPlugin 실행 시 포함 범위만 정한다.

