; @file DefaultFF_ZoneSystem.ini
; @brief FF_ZoneSystem의 출하 기본 설정이다.
;
; 소스 CDO 설정 중 배포에 필요한 일부 값을 중복 명시하는 파일이며 예약 파일명은 FF_ 접두사
; 예외다. 설정 클래스는 Config=Game이므로 비기본 override를 출하하기 전 Editor·Cook의 실제 CDO
; 로드를 자동화로 검증한다. 값은 Project Settings > Game > FF_ZoneSystem에서 관리한다.
; 단위와 승인 절차는 ../FF_README_KO.md의 설정·QA Gate 절을 따른다.
; 이 수치들은 게임 Prototype 기본값이며 실제 행사 안전·법률 인증값이 아니다.

[/Script/FF_ZoneSystem.FFZSDeveloperSettings]

; expanded footprint 이론 면적과 canonical queue rect 면적에 적용하는 보수적 작업량 상한.
; 실제 unique 출력 cell 수나 debug/Blueprint 물질화 한도가 아니라 입력을 조기 거절하는 안전 예산이다.
MaxEnumeratedCellsPerFacility=10000000

; 1cm 점유 해상도와 분리한 지면 LineTrace 물리 표본 간격(cm). 기본은 기존 1m 검증 밀도를 보존한다.
GroundSampleSpacingCm=100.000000

; Queue 시뮬레이션 고정 간격(초). 낮출수록 반응은 촘촘하지만 CPU 호출 횟수가 증가한다.
QueueSimulationTickIntervalSeconds=0.100000

; 바닥·Navigation 배치 검증 허용치. 각 값의 단위는 이름의 Degrees/Cm을 따른다.
MaxGroundSlopeDegrees=5.000000
MaxGroundHeightVarianceCm=20.000000
NavigationProjectionExtentCm=30.000000

; Zone 경계에서 소속이 매 프레임 흔들리지 않도록 유지하는 설정 가능한 완충 거리(cm).
ZoneMembershipHysteresisCm=50.000000

; Prototype 통로 폭(cm). 실제 현장 기준으로 오해하지 말고 Safety Owner 승인 아래 조정한다.
GeneralRouteWidthCm=300.000000
EmergencyServiceRouteWidthCm=400.000000
AccessibilityRouteWidthCm=150.000000

; Zone soft capacity와 밀도 단계의 Prototype 기준.
SquareMetersPerPersonForSoftCapacity=4.000000
DensityCautionRatio=0.800000
DensityWarningRatio=1.000000
DensityCriticalRatio=1.250000

; 높은 밀도 단계로 올라가기 전 유지 시간(초). 하향 전환 규칙은 Runtime 코드가 담당한다.
DensityWarningHoldSeconds=5.000000
DensityCriticalHoldSeconds=3.000000

; True이면 ProjectZoneIds에 등록된 Stable ID만 허용한다.
bRestrictZoneIdsToProjectPresets=True

; True이면 프로젝트가 Production Policy 도메인을 모두 등록하지 않은 명령을 거절한다.
; 기본 False는 독립 Prototype과 테스트가 외부 시스템 없이 동작하도록 하기 위한 값이다.
bRequireProductionPolicyDomains=False
