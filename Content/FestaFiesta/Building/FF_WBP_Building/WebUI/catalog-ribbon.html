<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>시설 목록</title>
<style>

.select:focus-visible{outline:3px solid var(--action);outline-offset:-4px}
.thumb{position:absolute;left:10px;top:9px;width:162px;height:104px;border-radius:8px;object-fit:contain;background:var(--pearl)}

.card.required-missing:hover,
.card.required-missing.selected,
.card.required-missing.codex-focused{background:#FFF2F4;border-color:var(--danger)}

.badge.synergy{background:#676188;color:#FFFFFF}

.favorite{position:absolute;right:4px;top:3px;width:44px;height:44px;padding:0;border:0;border-radius:8px;background:transparent;font-size:30px;line-height:44px;font-weight:400;color:var(--muted);z-index:2}

.select:disabled{cursor:default}

@media(prefers-reduced-motion:reduce){
#ribbon{scroll-behavior:auto}
