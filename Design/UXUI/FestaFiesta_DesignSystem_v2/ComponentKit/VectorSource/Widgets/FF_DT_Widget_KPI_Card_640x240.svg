<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240"><defs>
  <linearGradient id="g-primary" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8BE9D4"/>
    <stop offset="1" stop-color="#238C79"/>
  </linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#193536" stop-opacity=".98"/>
    <stop offset="1" stop-color="#0B1C1D" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="g-light" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EAEFEA"/>
  </linearGradient>
  <linearGradient id="g-danger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8A74"/>
    <stop offset="1" stop-color="#C94C43"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001010" flood-opacity=".48"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001010" flood-opacity=".32"/>
  </filter>
  <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#65BDAA" stroke-width="1" stroke-opacity=".10"/>
  </pattern>
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFFFFF" stroke-width="4" stroke-opacity=".28"/>
  </pattern></defs><g filter="url(#shadow)"><rect x="13.5" y="13.5" width="613" height="213" rx="28" fill="url(#g-panel)" fill-opacity="0.98" stroke="#335352" stroke-width="3"/><rect x="12" y="12" width="12" height="216" rx="6" fill="#57D4B8"/><circle cx="82" cy="78" r="34" fill="#57D4B8" fill-opacity=".14" stroke="#57D4B8" stroke-width="3"/><rect x="140" y="48" width="206" height="14" rx="7" fill="#91AAA5" fill-opacity="0.55" stroke="none" stroke-width="0"/><rect x="140" y="80" width="326" height="34" rx="17" fill="#F6F5EF" fill-opacity="0.93" stroke="none" stroke-width="0"/><rect x="48" y="158" width="496" height="18" rx="9" fill="#F6F5EF" fill-opacity="0.18" stroke="none" stroke-width="0"/><rect x="48" y="158" width="356" height="18" rx="9" fill="url(#g-primary)" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="566" cy="72" r="9" fill="#72C49A" filter="url(#glow)"/></g></svg>