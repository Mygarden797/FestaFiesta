<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs>
  <linearGradient id="g-primary" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8BE9D4"/>
    <stop offset="1" stop-color="#238C79"/>
  </linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#193536" stop-opacity=".98"/>
    <stop offset="1" stop-color="#0B1C1D" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="g-light" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EAEFEA"/>
  </linearGradient>
  <linearGradient id="g-danger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8A74"/>
    <stop offset="1" stop-color="#C94C43"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001010" flood-opacity=".48"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001010" flood-opacity=".32"/>
  </filter>
  <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#65BDAA" stroke-width="1" stroke-opacity=".10"/>
  </pattern>
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFFFFF" stroke-width="4" stroke-opacity=".28"/>
  </pattern></defs><g filter="url(#shadow)"><rect x="20" y="20" width="1240" height="760" rx="34" fill="url(#g-panel)" fill-opacity="0.995" stroke="#4B6E69" stroke-width="4"/><rect x="18" y="18" width="1244" height="112" rx="34" fill="#183A38"/><path d="M18 116H1262" stroke="#517771" stroke-width="2"/><rect x="64" y="56" width="430" height="26" rx="13" fill="#F6F5EF" fill-opacity="0.86" stroke="none" stroke-width="0"/><circle cx="1194" cy="72" r="26" fill="#102829" stroke="#476B66" stroke-width="2"/><path d="M1184 62L1204 82M1204 62L1184 82" stroke="#F6F5EF" stroke-width="4" stroke-linecap="round"/><circle cx="134" cy="270" r="76" fill="#57D4B8" fill-opacity=".14" stroke="#57D4B8" stroke-width="4"/><path d="M104 272L126 294L168 246" fill="none" stroke="#8BE9D4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="204" width="690" height="28" rx="14" fill="#F6F5EF" fill-opacity="0.84" stroke="none" stroke-width="0"/><rect x="250" y="258" width="820" height="15" rx="7.5" fill="#91AAA5" fill-opacity="0.4" stroke="none" stroke-width="0"/><rect x="250" y="298" width="724" height="15" rx="7.5" fill="#91AAA5" fill-opacity="0.32" stroke="none" stroke-width="0"/><rect x="64" y="410" width="1152" height="2" fill="#3C5754"/><rect x="64" y="466" width="426" height="16" rx="8" fill="#F6F5EF" fill-opacity="0.48" stroke="none" stroke-width="0"/><rect x="64" y="510" width="920" height="14" rx="7" fill="#91AAA5" fill-opacity="0.28" stroke="none" stroke-width="0"/><rect x="64" y="548" width="812" height="14" rx="7" fill="#91AAA5" fill-opacity="0.22" stroke="none" stroke-width="0"/><rect x="745.5" y="675.5" width="191" height="69" rx="36" fill="#112728" fill-opacity="1" stroke="#486B66" stroke-width="3"/><rect x="961.5" y="675.5" width="253" height="69" rx="36" fill="url(#g-primary)" fill-opacity="1" stroke="#A0F0DD" stroke-width="3"/></g></svg>