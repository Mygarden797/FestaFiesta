<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="176" viewBox="0 0 1536 176"><defs>
  <linearGradient id="g-primary" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8BE9D4"/>
    <stop offset="1" stop-color="#238C79"/>
  </linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#193536" stop-opacity=".98"/>
    <stop offset="1" stop-color="#0B1C1D" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="g-light" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EAEFEA"/>
  </linearGradient>
  <linearGradient id="g-danger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8A74"/>
    <stop offset="1" stop-color="#C94C43"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001010" flood-opacity=".48"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001010" flood-opacity=".32"/>
  </filter>
  <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#65BDAA" stroke-width="1" stroke-opacity=".10"/>
  </pattern>
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFFFFF" stroke-width="4" stroke-opacity=".28"/>
  </pattern></defs><g filter="url(#shadow)"><rect x="13.5" y="13.5" width="1509" height="149" rx="30" fill="url(#g-panel)" fill-opacity="0.98" stroke="#335352" stroke-width="3"/><circle cx="72" cy="88" r="28" fill="#193C38" stroke="#57D4B8" stroke-width="3"/><path d="M64 71L88 88L64 105Z" fill="#F6F5EF"/><rect x="136" y="82" width="1190" height="12" rx="6" fill="#35514F" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="136" y="82" width="760" height="12" rx="6" fill="url(#g-primary)"/><circle cx="896" cy="88" r="18" fill="#F6F5EF" stroke="#57D4B8" stroke-width="5"/><circle cx="402" cy="88" r="7" fill="#F6F5EF"/><circle cx="1154" cy="88" r="7" fill="#F0B44D"/><path d="M402 56V120M1154 56V120" stroke="#BBD0CB" stroke-width="2" stroke-opacity=".32" stroke-dasharray="5 5"/><rect x="1365.5" y="55.5" width="113" height="65" rx="34" fill="#163331" fill-opacity="1" stroke="#47736C" stroke-width="3"/><path d="M1392 88H1452M1422 68V108" stroke="#8BE9D4" stroke-width="4" stroke-linecap="round"/></g></svg>