<svg xmlns="http://www.w3.org/2000/svg" width="960" height="128" viewBox="0 0 960 128"><defs>
  <linearGradient id="g-primary" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8BE9D4"/>
    <stop offset="1" stop-color="#238C79"/>
  </linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#193536" stop-opacity=".98"/>
    <stop offset="1" stop-color="#0B1C1D" stop-opacity=".98"/>
  </linearGradient>
  <linearGradient id="g-light" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EAEFEA"/>
  </linearGradient>
  <linearGradient id="g-danger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8A74"/>
    <stop offset="1" stop-color="#C94C43"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001010" flood-opacity=".48"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-40%" width="160%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001010" flood-opacity=".32"/>
  </filter>
  <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#65BDAA" stroke-width="1" stroke-opacity=".10"/>
  </pattern>
  <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFFFFF" stroke-width="4" stroke-opacity=".28"/>
  </pattern></defs><g filter="url(#softShadow)"><rect x="11.5" y="11.5" width="937" height="105" rx="20" fill="#112829" fill-opacity="0.98" stroke="#335352" stroke-width="3"/><circle cx="56" cy="64" r="24" fill="#1B3B39" stroke="#4A7770" stroke-width="2"/><path d="M38 64C49 50 67 50 78 64C67 78 49 78 38 64Z" fill="none" stroke="#8BE9D4" stroke-width="3"/><circle cx="58" cy="64" r="6" fill="#8BE9D4"/><rect x="104" y="40" width="268" height="16" rx="8" fill="#F6F5EF" fill-opacity="0.72" stroke="none" stroke-width="0"/><rect x="104" y="72" width="180" height="10" rx="5" fill="#91AAA5" fill-opacity="0.38" stroke="none" stroke-width="0"/><rect x="432" y="58" width="324" height="12" rx="6" fill="#F6F5EF" fill-opacity="0.15" stroke="none" stroke-width="0"/><rect x="432" y="58" width="224" height="12" rx="6" fill="#57D4B8" fill-opacity="1" stroke="none" stroke-width="0"/><circle cx="656" cy="64" r="16" fill="#F6F5EF" stroke="#57D4B8" stroke-width="4"/><circle cx="842" cy="64" r="24" fill="#183332" stroke="#4B6A67" stroke-width="2"/><path d="M832 64H852M842 54V74" stroke="#8BE9D4" stroke-width="3" stroke-linecap="round"/></g></svg>