;                    (안 들어가면 단계 시간표가 통째로 비어서 `개장하기` 가 안 눌리고
;                     자동 진행도 안 된다 — 2026-08-28 패키징에서 실제로 셋업에 갇혔다)
;   Building/Guide : WBP_FF_BuildModeGuide
;   Minigame       : DA_Minigame_Surfing·DT_SurfingCourse
; 새로 문자열 경로로 자산을 읽는 코드를 쓰면 그 폴더도 여기 추가한다.
+DirectoriesToAlwaysCook=(Path="/Game/FestaFiesta/Data")
+DirectoriesToAlwaysCook=(Path="/Game/FestaFiesta/Building/Guide")
+DirectoriesToAlwaysCook=(Path="/Game/FestaFiesta/Minigame")
