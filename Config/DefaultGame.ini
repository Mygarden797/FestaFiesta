; 쿠커의 참조 그래프에 안 잡혀서 패키징 빌드에 안 들어가고, 런타임에 조용히 실패한다.
; 2026-08-28 패키징에서 홍보 확인창이 그래서 안 떴다. UI 폴더는 통째로 쿠킹한다.
+DirectoriesToAlwaysCook=(Path="/Game/FestaFiesta/UI")

; 🔴 아래 세 줄도 같은 이유다 — **C++ 가 문자열 경로로 읽는 자산들**이다.
